<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shyne OS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

<h2>💙 Shyne OS</h2>

<a href="#">🏠 Dashboard</a>

<a href="#">🏋 Fitness</a>

<a href="#">🍗 Nutrition</a>

<a href="#">💰 Savings</a>

<a href="#">📚 Nursing</a>

<a href="#">📸 Progress</a>

<a href="#">📝 Journal</a>

</div>

<div class="main">

<h1 onclick="sayHello()">Welcome back, Shyne 👋</h1>

<div class="cards">

<div class="card">
    <h3>⚖️ Weight</h3>

    <p id="weightDisplay">80 kg</p>

    <input
        id="weightInput"
        type="number"
        placeholder="Enter weight">

    <br><br>

    <button onclick="saveWeight()">
        Save
    </button>

</div>

<div class="card">
<h3>🎯 Goal</h3>

<p id="goalDisplay">65 kg</p>

<input
    id="goalInput"
    type="number"
    placeholder="Enter goal">

<br><br>

<button onclick="saveGoal()">
    Save Goal
</button>

</div>

<div class="card">
    <h3>🔥 Gym Streak</h3>

    <p id="streakDisplay">0 Days</p>

    <button onclick="addWorkout()">
        Workout Done
    </button>

    <br><br>

    <button onclick="resetStreak()">
        🔄 Reset
    </button>
</div>

<div class="card">
    <h3>💰 Savings</h3>

    <p id="savingsDisplay">₱0 / ₱10,000</p>

    <input
        id="savingsInput"
        type="number"
        placeholder="Enter amount">

    <br><br>

    <button onclick="addSavings()">
    Add Money
    <br><br>

<button onclick="resetSavings()">
    🔄 Reset Savings
</button>
</div>

<div class="card">
    <h3>🥩 Protein</h3>

    <p id="proteinDisplay">0 / 140 g</p>
<div class="progress">
    <div id="proteinBar" class="progress-fill"></div>
</div>
    <input
        id="proteinInput"
        type="number"
        placeholder="Enter grams">

    <br><br>

    <button onclick="addProtein()">
        Add Protein
    </button>

    <br><br>

    <button onclick="resetProtein()">
        🔄 Reset Protein
    </button>
</div>

<div class="card">
    <h3>💧 Water</h3>

    <p id="waterDisplay">0 / 3.5 L</p>
<div class="progress">
    <div id="waterBar" class="progress-fill"></div>
</div>
    <input
        id="waterInput"
        type="number"
        step="0.1"
        placeholder="Enter liters">

    <br><br>

    <button onclick="addSavings()">
    Add Money
</button>

<br><br>

<button onclick="resetSavings()">
    🔄 Reset Savings
</button>
</div>

</div>
</div>
    
<div id="toast" class="toast">
    ✅ Weight saved!
</div>

<script src="script.js"></script>

</body>
</html>
